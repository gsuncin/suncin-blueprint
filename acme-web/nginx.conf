# Serves both Vite entries from one image. Which one a visitor gets is decided
# by the Host header, so the app and the landing page share a build and a
# deploy without either being able to import the other's code.

map $http_host $spa_fallback {
    default                     /index.html;
    ~*^(www\.)?acme\.localhost$ /landing.html;
    ~*^(www\.)?acme\.example\.com$ /landing.html;
}

server {
    # 8080, not 80: this image runs as an unprivileged user, which cannot bind
    # a port below 1024.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json
               image/svg+xml application/manifest+json;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed filenames, so these can be cached hard. The HTML that references
    # them is not, which is what makes a deploy visible immediately.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # `/` needs an exact-match block of its own. With only the prefix location
    # below, the `index` directive resolves index.html — which exists — so
    # try_files is satisfied before it ever consults $spa_fallback, and the
    # apex serves the app instead of the landing page.
    location = / {
        add_header Cache-Control "no-cache";
        try_files $spa_fallback =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $spa_fallback;
    }
}

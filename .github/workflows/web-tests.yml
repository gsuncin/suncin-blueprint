# workflow_call ONLY. See bff-tests.yml for why a second trigger breaks this.
name: web tests

on:
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: web-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest-and-playwright:
    runs-on: ubuntu-latest
    # 60, not 20: `playwright install` alone took 10.5 minutes on one hosted
    # runner in graav-app. The limit guards a hung job; it is not a budget.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: acme-web/.nvmrc
          cache: npm
          cache-dependency-path: acme-web/package-lock.json

      - run: npm ci
        working-directory: acme-web

      - run: npx playwright install --with-deps chromium
        working-directory: acme-web

      - run: npm run lint
        working-directory: acme-web

      # tsc runs here. Type errors surface at build, not at test.
      - run: npm run build
        working-directory: acme-web

      - run: npm run test:unit
        working-directory: acme-web

      - run: npm run test:e2e
        working-directory: acme-web

      # Performance and accessibility floors for the landing page, which is the
      # only page an anonymous visitor sees.
      # `lhci autorun` directly, not `npm run test:lighthouse`: that script runs
      # `npm run build` first and would rebuild the dist/ the build step above
      # just produced. lighthouserc.cjs serves that dist/ with `vite preview`.
      - run: npx lhci autorun
        working-directory: acme-web

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-reports
          path: |
            acme-web/playwright-report/
            acme-web/.lighthouseci/
          retention-days: 7

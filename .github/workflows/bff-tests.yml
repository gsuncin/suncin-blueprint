# workflow_call ONLY — no push, no pull_request.
#
# A direct trigger alongside the reusable call means two runs share the
# concurrency group below, and cancel-in-progress kills one of them. The
# symptom is a red check that was cancelled after two seconds sitting next to
# the green one that actually ran, which is how a team learns to ignore a red
# check.
name: bff tests

on:
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: bff-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django:
    runs-on: ubuntu-latest
    # 60, not 15: graav-app's release PR was cancelled at 15m18s when its suite
    # reached ~2,000 tests. The limit guards a hung job; it is not a budget.
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: acme_test
          POSTGRES_USER: acme
          POSTGRES_PASSWORD: acme
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]

    env:
      DEBUG: "True"
      SECRET_KEY: ci-only-not-a-real-key
      DB_NAME: acme_test
      DB_USER: acme
      DB_PASSWORD: acme
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      CELERY_TASK_ALWAYS_EAGER: "True"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: acme-bff/requirements-dev.txt

      - run: pip install -r requirements-dev.txt
        working-directory: acme-bff

      # DATABASES["default"]["TEST"] is a MIRROR, so the runner uses DB_NAME
      # directly instead of creating a throwaway database. Migrating first is
      # not optional: without it every test errors with "relation ... does not
      # exist".
      - run: python manage.py migrate --noinput
        working-directory: acme-bff

      - run: python manage.py createcachetable
        working-directory: acme-bff

      # Catches a model change that was never turned into a migration — which
      # passes locally against an already-migrated database and fails on the
      # next fresh deploy.
      - run: python manage.py makemigrations --check --dry-run
        working-directory: acme-bff

      - name: check --deploy
        working-directory: acme-bff
        # The key is GENERATED HERE, not carried as a repository secret.
        # `secrets.CI_JWT_PRIVATE_KEY_B64` is the kind of secret nobody
        # remembers to set: the step then reads an empty string and fails
        # unconditionally with "JWT_PRIVATE_KEY_B64 is required when DEBUG is
        # off" — invisibly, because this workflow is path-filtered on
        # acme-bff/** and a run only happens when someone touches the BFF.
        #
        # `check --deploy` starts the process and signs nothing, so a throwaway
        # key is not a weaker version of a real one; it is the honest
        # expression of what this step needs. A real secret in a workflow file
        # would be a secret published for no benefit.
        run: |
          set -euo pipefail
          JWT_PRIVATE_KEY_B64="$(openssl genpkey -algorithm RSA \
            -pkeyopt rsa_keygen_bits:2048 2>/dev/null | base64 -w0)"
          export JWT_PRIVATE_KEY_B64
          python manage.py check --deploy --fail-level ERROR
        env:
          DEBUG: "False"
          ALLOWED_HOSTS: app.example.com
          # Object storage. The composition root refuses to start without these
          # four, which is the feature — and it means adding a required setting
          # is also a change to THIS step. A local run has DEBUG=True and never
          # reaches the refusal, so the local suite goes green and CI goes red
          # in under a minute; that asymmetry is the point of the step.
          #
          # Values are throwaway. `check --deploy` starts the process and talks
          # to no object store, so a real credential here would be a secret
          # published for no benefit. STORAGE_BUCKET_PUBLIC is absent on
          # purpose: nothing requires it, and core/tests_storage.py asserts
          # both directions.
          STORAGE_ENDPOINT: http://minio.invalid:9000
          STORAGE_ACCESS_KEY: check-deploy-only
          STORAGE_SECRET_KEY: ${{ github.run_id }}-check-deploy-only
          STORAGE_BUCKET_PRIVATE: check-deploy-only

      # In parallel, on throwaway test_<DB_NAME> databases. Serial on MIRROR this
      # one step was 23 to 34 minutes of graav-app's job in November 2026.
      # TEST_PARALLEL turns MIRROR off, which --parallel needs: each worker
      # clones its own database from the one Django creates. The `migrate`
      # above still proves the migrations apply to DB_NAME itself. `auto` is one
      # worker per CPU. run-all-tests.sh stays serial on MIRROR as the local gate.
      - run: python manage.py test --parallel auto --noinput --verbosity 2
        working-directory: acme-bff
        env:
          TEST_PARALLEL: "True"

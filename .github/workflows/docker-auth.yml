name: build acme-gateway-auth

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "acme-gateway/auth/**"
      - ".github/workflows/docker-auth.yml"
      - ".github/workflows/auth-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "acme-gateway/auth/**"
      - ".github/workflows/docker-auth.yml"
      - ".github/workflows/auth-tests.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate. deploy-prod.yml fires on this workflow completing, so a red suite
  # here is what stops a bad image reaching production — there is no separate
  # check to forget to wire up.
  tests:
    uses: ./.github/workflows/auth-tests.yml

  build-and-push:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/acme-gateway-auth
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ./acme-gateway/auth
          platforms: linux/amd64,linux/arm64
          # PRs build but never publish: the build is the check, and a PR that
          # can push can overwrite a tag production is running.
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: isolation

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review: a draft runs nothing (scripts/check-ci-skips-drafts.sh).
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: isolation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # C-12 is the rule most likely to be broken by accident — someone publishes a
  # port to debug something and does not take it out again. This runs on every
  # change, not on a path filter, because the compose file is not the only way
  # to break it.
  gateway-is-the-only-ingress:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: generate local secrets
        run: ./scripts/gen-keys.sh

      - name: build and start the stack
        run: docker compose up -d --build --wait

      - name: verify isolation
        run: ./scripts/verify-isolation.sh

      # TD-1. The BFF's suite mocks each service and each service's suite mocks
      # the BFF, so a wire contract between them is asserted twice and checked
      # never — a header under two names, or a request body the route has never
      # accepted, survives thousands of green mocked tests and is only found by
      # an actual call through a running stack.
      #
      # `rehearse_integrations` derives its subject list from each
      # `integrations/*_client.py` module's `__all__`, so a function with no
      # caller is exercised anyway, and it fails closed if that derivation comes
      # back empty.
      - name: migrate and seed
        run: |
          docker compose exec -T bff python manage.py migrate --noinput
          docker compose exec -T bff python manage.py createcachetable
          docker compose exec -T bff python manage.py seed_dev

      - name: call every function integrations/ exports, for real
        run: docker compose exec -T bff python manage.py rehearse_integrations

      - name: stack logs
        if: failure()
        run: docker compose logs --tail 100

      - name: tear down
        if: always()
        run: docker compose down -v

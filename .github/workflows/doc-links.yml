name: doc links

# The gate for scripts/check-doc-links.sh.
#
# A check that exists and nothing calls guards nothing — which is how a
# documentation restructuring pushes a handful of broken links to main in one
# commit while every suite stays green. The PostToolUse hook in
# .claude/settings.json runs the same script on one file at edit time; this runs
# it over the tree, and this is what blocks the merge.
#
# No path filter. The links point ACROSS directories, so a file moved anywhere
# can break a link in specs/ — filtering on the docs would miss exactly the
# change that breaks them.
on:
  pull_request:
    # ready_for_review: a draft runs nothing (scripts/check-ci-skips-drafts.sh).
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: doc-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check-doc-links.sh
      # The CI-machinery selftests ride on this job, not a job of their own: a
      # job is billed in whole minutes and each of these takes seconds.
      # `!cancelled()` so one red step does not hide the next.
      - name: tested-tree selftest
        if: ${{ !cancelled() }}
        run: ./scripts/tests/tested-tree.test.sh
      - name: retag-unchanged selftest
        if: ${{ !cancelled() }}
        run: ./scripts/tests/retag-unchanged.test.sh
      - name: gateway rate limits
        if: ${{ !cancelled() }}
        run: ./scripts/tests/gateway-rate-limits.test.sh
      - name: workflows skip drafts
        if: ${{ !cancelled() }}
        run: ./scripts/check-ci-skips-drafts.sh
      - name: merge-release selftest
        if: ${{ !cancelled() }}
        run: ./scripts/tests/merge-release.test.sh

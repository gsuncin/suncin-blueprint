name: terraform

on:
  push:
    branches: [main]
    paths: ["acme-tf/**", "acme-gateway/traefik/**", ".github/workflows/terraform-checks.yml"]
  pull_request:
    branches: [main]
    paths: ["acme-tf/**", "acme-gateway/traefik/**", ".github/workflows/terraform-checks.yml"]

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.3

      - run: terraform fmt -check -recursive acme-tf

      # -backend=false is what lets validation run with no credentials and no
      # access to state.
      - name: validate every root module
        run: |
          for dir in acme-tf/envs/*/ acme-tf/modules/*/ acme-tf/tests/*/; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      # Renders the cloud-init and asserts on the result. Catches template bugs
      # — a consumed '$' in a secret, a missing variable, a second published
      # port — before they reach a box, where the only symptom is a machine
      # that half-booted.
      - name: render tests
        run: terraform -chdir=acme-tf/tests/render test

      - uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: acme-tf
          soft_fail: false

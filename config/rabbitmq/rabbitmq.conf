# Celery still needs transient non-exclusive queues.
#
# RabbitMQ 4 turned this deprecated feature off by default. Celery's control
# protocol — which is what `celery inspect ping`, `celery status` and every
# remote-control command use — declares its reply queue that way, so without
# this the worker runs and consumes tasks fine but every operational command
# fails with:
#
#   INTERNAL_ERROR - Feature `transient_nonexcl_queues` is deprecated
#
# which also means the container healthcheck can never pass.
#
# The alternative is pinning to RabbitMQ 3.13, which is closer to end of life
# than this flag is to removal. Revisit when Celery stops declaring reply
# queues this way; the flag disappears in some future RabbitMQ major regardless
# of configuration, so this is a reprieve, not a fix.
deprecated_features.permit.transient_nonexcl_queues = true

[pytest]
testpaths = tests
# The app is a plain package at the repo root, not an installed distribution.
# Without this, `from app...` fails unless the suite is run with the root on
# PYTHONPATH, which makes the command depend on the shell you ran it from.
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    error::DeprecationWarning
